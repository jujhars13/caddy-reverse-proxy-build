name: build container

on:
  # Runs on pushes targeting the default branch
  push:
    tags:
      - '*'
  # Allows you to run this workflow manually from the Actions tab too
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write
  attestations: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    env:
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: jujhars13
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Caddy w/Coraza image to registry
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jujhars13/caddy-reverse-proxy:${{ github.ref_name }}
            ghcr.io/jujhars13/caddy-reverse-proxy:latest
            docker.io/jujhars13/caddy-reverse-proxy:${{ github.ref_name }}
            docker.io/jujhars13/caddy-reverse-proxy:latest

      # ATTENTION: Docker Hub only allows description updates with a PAT scoped
      # "Read, Write, Delete" — a "Read & Write" token pushes fine but fails here (403)
      - name: Publish README.md to Docker Hub repo description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: jujhars13
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: jujhars13/caddy-reverse-proxy
          short-description: "Caddy with Coraza WAF + OWASP Core Rule Set"
          readme-filepath: ./README.md
